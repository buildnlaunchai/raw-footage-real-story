[package]
name = "raw-footage-real-story"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "raw_footage_real_story_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls rather than the default native-tls: no OpenSSL to find at build time,
# which keeps the eventual Windows build a non-event.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Kokoro TTS: ONNX inference + WAV writing. ort 2.x is release-candidate only —
# there is no stable release — so the version is pinned exactly rather than
# floating on a caret range.
#
# Note: no `ndarray` feature and no direct ndarray dependency. ort pins its own
# ndarray (0.17), and declaring our own pulled a second copy into the graph
# whose types are nominally distinct, so ort's trait impls did not apply. Tensors
# are built from `(shape, &[T])` tuples instead, which sidesteps the coupling.
ort = { version = "=2.0.0-rc.13" }
hound = "3"
zip = "2"
sha2 = "0.10"
# PKCE: the OS random source directly, and base64url for the challenge. Both
# are already in the tree via other crates; named here because auth depends on
# them for correctness rather than incidentally.
getrandom = "0.3"
base64 = "0.22"
# Licence tokens are RS256 JWTs signed by the platform. Verified offline, so
# a cached entitlement is evidence rather than an editable file — see
# src/licence.rs. Its crypto is `ring`, which rustls already pulls in, so this
# adds a parser and not a second crypto stack.
jsonwebtoken = "9"
tauri-plugin-dialog = "2.7.2"

# For `setrlimit` only. A GUI app inherits macOS's 256-descriptor soft limit
# from launchd, and a long film opens far more than that — see
# Only `sync`, and only for one Mutex: refresh tokens rotate, so the credit-mode
# session refresh has to be serialised or two concurrent calls spend two tokens
# and the loser's rotation kills the winner's session. See platform::fresh_access.
# tokio is already in the tree via tauri; this makes the dependency explicit
# rather than relying on a re-export.
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }

# `raise_file_limit` in ffmpeg.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Integration tests drive the async Ollama commands directly.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

# keyring's platform backends are opt-in features. Without one it compiles
# against its **mock** store (`pub use mock as default`), which accepts a write,
# returns Ok, and stores nothing — so the API looks like it works and silently
# discards every credential. Each target gets a real backend explicitly.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# The D-Bus Secret Service (GNOME Keyring / KWallet) rather than linux-native,
# which uses kernel keyutils and does not survive a reboot.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
