[package]
name = "raw-footage-real-story"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "raw_footage_real_story_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls rather than the default native-tls: no OpenSSL to find at build time,
# which keeps the eventual Windows build a non-event.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Kokoro TTS: ONNX inference + WAV writing. ort 2.x is release-candidate only —
# there is no stable release — so the version is pinned exactly rather than
# floating on a caret range.
#
# Note: no `ndarray` feature and no direct ndarray dependency. ort pins its own
# ndarray (0.17), and declaring our own pulled a second copy into the graph
# whose types are nominally distinct, so ort's trait impls did not apply. Tensors
# are built from `(shape, &[T])` tuples instead, which sidesteps the coupling.
ort = { version = "=2.0.0-rc.13" }
hound = "3"

[dev-dependencies]
# Integration tests drive the async Ollama commands directly.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


