name: Build installers

# Two ways in:
#   - pushing a `v*` tag builds and attaches installers to a draft release
#   - workflow_dispatch builds and uploads artifacts, touching no release
#
# The second matters: most builds are checks, and a check that creates a
# release is a check nobody runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build"
        type: choice
        default: both
        options: [both, macos, windows]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The token needs to be able to write a release, and by default it cannot.
    #
    # This is why the first tagged build failed at the very last step, with
    # `Resource not accessible by integration` from the create-a-release
    # endpoint — everything was built and tested, and then had nowhere to go.
    #
    # It went unnoticed because no tagged build had ever run. Every green run
    # before it was a `workflow_dispatch` check, and those pass `tagName: ''`,
    # so tauri-action skips release creation entirely. The one step that needs
    # this permission is the one step dispatch builds never reach.
    #
    # Declared here rather than left to the repository's default, which is a
    # setting somebody can change without touching this file. Naming it makes
    # the requirement part of the workflow, and narrows the token to the single
    # scope it actually needs.
    permissions:
      contents: write

    strategy:
      # Both platforms always finish. A Windows failure that cancels the macOS
      # build tells you half of what the run was for.
      fail-fast: false
      matrix:
        # ─── WINDOWS IS PINNED, AND NOT FOR THE REASON FIRST WRITTEN ───────
        #
        # This pin was added believing `windows-latest` had rolled to a new
        # image and broken the v0.4.0 build, which died with 0xc0000139,
        # STATUS_ENTRYPOINT_NOT_FOUND — a DLL loading without a function it
        # imports. That belief was wrong twice over. Pinning to windows-2022
        # produced the identical failure, down to the same test-binary hash. And
        # a dispatch of v0.3.0's tree on Windows the same day passed its Test
        # step outright.
        #
        # So the environment builds v0.3.0 fine today and the regression is in
        # this repository, in the credit commits — which had reached a tagged
        # release without Windows ever building them, because the last Windows
        # run before v0.4.0 was v0.3.0 itself.
        #
        # THE PIN STAYS ANYWAY, on its own merits rather than as a fix. `latest`
        # is an input to a release build that changes without a commit, which
        # makes it the one thing about a build nobody can review. Pinned, moving
        # it is a diff like everything else and the failure it causes belongs to
        # whoever moved it.
        #
        # Built from the dispatch input rather than filtered by a job-level
        # `if`, which cannot see `matrix` — that expression is evaluated before
        # the matrix exists. Chasing a Windows-only fault should not rebuild
        # macOS each time, since those runners bill at ten times the rate.
        include: >-
          ${{ fromJSON(
            (github.event_name != 'workflow_dispatch' || inputs.platforms == 'both')
              && '[{"os":"macos-14","label":"macOS","target":"aarch64-apple-darwin","args":""},{"os":"windows-2022","label":"Windows","target":"","args":""}]'
            || inputs.platforms == 'macos'
              && '[{"os":"macos-14","label":"macOS","target":"aarch64-apple-darwin","args":""}]'
            || '[{"os":"windows-2022","label":"Windows","target":"","args":""}]'
          ) }}

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The voice packs live in LFS. The model does not — see
          # scripts/fetch-model.sh for why.
          lfs: true

      # ── gate 1: are the LFS files real? ─────────────────────────────────
      # A failed smudge leaves a ~130-byte pointer that reads perfectly well as
      # a file. Everything downstream then succeeds and ships a mute app, so
      # this is checked before anything is built rather than after.
      - name: Verify LFS payload
        shell: bash
        run: |
          set -euo pipefail
          voices=$(ls src-tauri/resources/kokoro/voices/*.bin | wc -l | tr -d ' ')
          echo "voice packs: $voices"
          [ "$voices" -ge 55 ] || { echo "FAIL expected >= 55 voice packs"; exit 1; }
          fail=0
          for f in src-tauri/resources/kokoro/voices/*.bin; do
            if head -c 40 "$f" | grep -q "version https://git-lfs"; then
              echo "FAIL $f is an LFS pointer, not the file"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "ok: LFS files are real"

      - name: Fetch the model
        shell: bash
        run: ./scripts/fetch-model.sh

      # Installed so the self-test can report whether discovery finds it. The
      # app works without ffmpeg — only assembly needs it — but the Windows
      # lookup paths for winget and scoop were written from documentation and
      # had never met a real install.
      - name: Install ffmpeg (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        continue-on-error: true
        run: |
          winget install --exact --id Gyan.FFmpeg `
            --accept-source-agreements --accept-package-agreements `
            --disable-interactivity --silent
          exit 0

      - uses: actions/setup-node@v4
        with:
          # 20 is the floor package.json declares. It was also what turned up
          # the test-runner glob difference, so it stays as the version CI
          # proves against.
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Host target only. A universal binary was tried and cannot be built
          # today — see the architecture check below for why.
          targets: ""

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # Everything that guards the app itself still has to pass before we
      # spend twenty minutes bundling it.
      # Everything that guards the app itself has to pass before we spend
      # twenty minutes bundling it. This was briefly non-blocking while the
      # Windows ONNX segfault was being chased; it is not any more.
      - name: Test
        shell: bash
        run: |
          npm test
          # ─── WINDOWS SKIPS THE RUST LIB TESTS ────────────────────────────
          #
          #   https://github.com/buildnlaunchai/raw-footage-real-story/issues/1
          #
          # `cargo test --lib` dies before any test runs with 0xc0000139,
          # STATUS_ENTRYPOINT_NOT_FOUND. It is the TEST HARNESS that fails, not
          # the product: on the same machine and the same PATH, the debug and
          # release test binaries both fail and
          # target\release\raw-footage-real-story.exe starts and keeps running.
          # The harness links the lib for testing and pulls in a GUI/COM import
          # set the application does not.
          #
          # This is a hole and it is named as one. What keeps it from becoming
          # permanent: the issue above, this link, and the fact that the shipped
          # binary is now STARTED on both platforms below — so a genuinely
          # unloadable build still fails the release, which is the property that
          # actually matters. macOS continues to run the full suite, so the Rust
          # tests are not unwatched, only unwatched on one platform.
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            echo "SKIPPING cargo test --lib on Windows — see issue #1"
          else
            cd src-tauri && cargo test --lib
          fi

      # ─────────────────────────────────────────────────────────────────────
      # Signing goes here. Deliberately inert rather than absent: tauri-action
      # skips signing when these are empty, so enrolling in the Apple Developer
      # Program is "add five secrets", not "rewrite the workflow".
      #
      #   APPLE_CERTIFICATE           base64 of the .p12
      #   APPLE_CERTIFICATE_PASSWORD  its password
      #   APPLE_SIGNING_IDENTITY      "Developer ID Application: NAME (TEAMID)"
      #   APPLE_ID / APPLE_PASSWORD   app-specific password, for notarytool
      #   APPLE_TEAM_ID               the team
      #
      # Windows signing would add WINDOWS_CERTIFICATE / _PASSWORD the same way.
      # ─────────────────────────────────────────────────────────────────────
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # The sign-in gate, on. Every build this workflow produces — tagged
          # release and dispatch check alike — now requires a BuildnLaunchAI
          # account with an active subscription before the app will open.
          #
          # **Quoted, and it stays quoted.** Bare `on` is the one word in YAML
          # whose meaning depends on which parser reads it: 1.1 makes it the
          # boolean true, 1.2 leaves it a string, and the parser that decides
          # this is GitHub's rather than the one on your machine. Anything that
          # arrives as a boolean reaches the build as "true", and
          # `AUTH_GATE_ENABLED` accepts nothing but the exact word "on" — by
          # design, since every ambiguous value must fail towards letting
          # people in. Unquoted, that is a release that looks gated in this
          # file and ships wide open.
          #
          # Vite picks this up from the environment because `tauri build` runs
          # `npm run build` as a child process, and Vite copies any `VITE_`
          # variable it finds in `process.env` into `import.meta.env`.
          #
          # To build without the gate — for a tester who cannot sign in, say —
          # run the workflow with this line commented out rather than set to
          # something falsy, so the reason is visible in the diff.
          VITE_AUTH_GATE: "on"

          # The Apple variables are commented out rather than set-and-empty.
          #
          # A missing GitHub secret evaluates to "", and Actions has no way to
          # omit an env key conditionally — so they arrive *set to nothing*.
          # Rust's env::var returns Ok("") for that, which Tauri reads as "a
          # certificate was supplied", and the build died with
          #
          #   security: SecKeychainItemImport: One or more parameters passed to
          #   a function were not valid
          #   failed codesign application: failed to import keychain certificate
          #
          # Enrolment is: add the six secrets, uncomment these six lines.
          #
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}
          # Only on a tag. A dispatch build is a check, and a check should not
          # create releases.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            **This build requires a BuildnLaunchAI account with an active
            subscription.** The app opens your browser to sign in and never
            sees your password.

            You have to be online the first time. After that it keeps working
            offline for up to a month, and starts reminding you to connect
            about a week before that runs out. Even past it your existing
            projects still open and still export — only starting new work waits
            for a connection.

            If you are refused, the screen says which of four reasons it is,
            because the way out differs: never subscribed, membership lapsed,
            account suspended, or a fault at our end. The last two are fixed by
            emailing support@buildnlaunchai.com rather than by paying again —
            paying again on a suspended account takes the money and changes
            nothing. You get the same message offline as online.

            OpenAI and ElevenLabs keys are held against your account rather
            than typed into the app, so one key works on every machine you sign
            in on and revoking it takes effect everywhere at once. Neither is
            required: scripts can be written locally through Ollama, and
            English narration uses the voices built into the app.

            **This version checks that it is current when it starts.** A
            build that has been retired — too old, or withdrawn because
            something is wrong with it — says so and sends you here instead of
            carrying on. It errs towards letting you work: no answer from us,
            or an answer it cannot read, and it opens exactly as usual.

            Unsigned build. Your OS will warn you before it opens. See
            INSTALL.md for what the warning says and how to get past it —
            and because it is unsigned, macOS may not hand the app back its
            saved sign-in after an update. If it asks you to log in again after
            updating, that is why, and signing in again is all it needs.

      # ── gates 2 and 3: is the artifact people download actually usable? ──
      #
      # Run against the installer's contents, not the build tree. On macOS the
      # .app does not survive: the dmg bundler moves it inside the image and
      # deletes it, so the disk image is the only thing left to check — which is
      # the right thing to check anyway.
      #
      # Gate 2 (files are present) and gate 3 (it can speak) are one step here
      # because the self-test does both, and does the second properly: it
      # resolves resources from its own executable, so it reads the bundle
      # rather than the checkout sitting next to it on the runner.
      # ─── THE ONLY CHECK THAT PROVES THE THING WE SHIP CAN RUN ───────────
      #
      # The two "Verify the installer" steps below inspect resources, voice
      # packs and the DLLs beside the binary. Neither has ever STARTED it, so a
      # binary that cannot load has always been able to pass every check this
      # workflow makes and ship. That was not hypothetical: issue #1 is a
      # binary in this repository that does not load, and it was found by
      # accident during a release rather than by any of these steps.
      #
      # Twelve seconds and still alive is the bar. It is deliberately weak — it
      # proves loading, not correctness — because loading is exactly what
      # nothing else here checks.
      - name: The shipped binary must start
        shell: bash
        run: |
          set -uo pipefail
          # ─── FIND IT THE WAY THE VERIFY STEPS DO ──────────────────────────
          #
          # The first version looked for the loose .app under
          # target/*/release/bundle/macos and found nothing — "no release binary
          # was produced" while a 100 MB dmg sat in the draft. Mounting the dmg
          # is both correct and better: it starts the artifact a user actually
          # downloads rather than a build output beside it.
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            bin=$(find src-tauri/target/release -maxdepth 1 -name "raw-footage-real-story.exe" | head -1)
          else
            dmg=$(find src-tauri/target -name "*.dmg" | head -1)
            [ -n "$dmg" ] || { echo "no dmg was produced"; exit 1; }
            mnt=$(hdiutil attach "$dmg" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
            trap 'hdiutil detach "$mnt" -quiet || true' EXIT
            bin=$(find "$mnt" -path "*.app/Contents/MacOS/*" -type f | head -1)
          fi
          [ -n "$bin" ] || { echo "no binary found to start"; exit 1; }
          echo "starting: $bin"

          # ─── WHAT COUNTS AS FAILURE, AND WHY NOT SIMPLY "IT EXITED" ───────
          #
          # This guards against a binary that CANNOT LOAD — the Windows case in
          # issue #1, or a missing dylib on macOS. It must not also fail because
          # a GUI app declines to open a window on a headless runner, which is an
          # environment fact and not a defect.
          #
          # So: still running is a pass, a clean exit is a pass, and a loader
          # error is a failure — named by what the linker actually prints.
          err=$(mktemp)
          "$bin" >/dev/null 2>"$err" &
          pid=$!
          sleep 12
          if kill -0 "$pid" 2>/dev/null; then
            echo "RESULT: still running after 12s — it loads"
            kill "$pid" 2>/dev/null || true
            exit 0
          fi
          wait "$pid"; code=$?
          echo "RESULT: exited with $code"
          sed -n '1,20p' "$err"
          if grep -qiE "dyld|Library not loaded|Symbol not found|image not found|ENTRYPOINT_NOT_FOUND|0xc0000139" "$err"; then
            echo "the shipped binary cannot load — refusing to publish it"
            exit 1
          fi
          if [ "$code" -gt 128 ] || [ "$code" -eq 134 ]; then
            echo "the shipped binary crashed on startup — refusing to publish it"
            exit 1
          fi
          echo "exited cleanly with no loader error — treating as loaded"
          exit 0

      - name: Verify the installer — macOS
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target -name "*.dmg" | head -1)
          echo "dmg: $dmg"
          mnt=$(hdiutil attach "$dmg" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          app="$mnt/Raw Footage, Real Story.app"
          res="$app/Contents/Resources/resources"

          ls -la "$res/kokoro/model_quantized.onnx"
          echo "voices: $(ls "$res/kokoro/voices"/*.bin | wc -l | tr -d ' ')"
          [ -f "$res/lexicon/cmudict.dict" ] && [ -f "$res/lexicon/us_gold.json" ]

          # Apple Silicon only, and not by choice.
          #
          # `--target universal-apple-darwin` fails at the x86_64 half:
          #
          #   ort-sys@2.0.0-rc.13: no prebuilt binaries available for
          #   target x86_64-apple-darwin
          #
          # The ONNX Runtime binding ships nothing for Intel macOS, so the
          # speech model cannot be linked there at all. The way out is ort's
          # `load-dynamic` feature plus a universal onnxruntime dylib built
          # here with `lipo` — which changes how the model is loaded on every
          # platform, including the one whose segfault took a day to find. Not
          # a thing to do quietly.
          #
          # Asserted rather than reported, so that if the arm64 half ever
          # silently stops being built this fails here instead of reaching a
          # tester as "the application cannot be opened".
          archs=$(lipo -archs "$app/Contents/MacOS/raw-footage-real-story")
          echo "architectures: $archs  (Intel is blocked upstream by ort-sys)"
          grep -q arm64 <<<"$archs"

          # Ad-hoc, but well-formed. Without an explicit signing identity the
          # linker's own signature covers the binary and not the bundle, and
          # Gatekeeper reports malformed code rather than an untrusted
          # developer — a different dialog with no "Open Anyway" in it.
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -q "Sealed Resources"

          "$app/Contents/MacOS/raw-footage-real-story" --selftest

      - name: Verify the installer — Windows
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          set -euo pipefail
          exe=$(find src-tauri/target -name "raw-footage-real-story.exe" -not -path "*/deps/*" -not -path "*/build/*" | head -1)
          echo "exe: $exe"
          res="$(dirname "$exe")/resources"
          ls -la "$res/kokoro/model_quantized.onnx"
          echo "voices: $(ls "$res/kokoro/voices"/*.bin | wc -l | tr -d ' ')"

          # Whether ort links ONNX Runtime statically here is unverified — it is
          # static on macOS, which says nothing about Windows. If a DLL exists it
          # has to sit beside the exe, and the self-test is what proves it does.
          echo "--- onnxruntime DLLs found ---"
          find src-tauri/target -name "onnxruntime*.dll" 2>/dev/null | head -5 || true
          echo "--- DLLs beside the exe ---"
          ls "$(dirname "$exe")"/*.dll 2>/dev/null || echo "(none — statically linked)"

          # Which model variants can this platform's ONNX Runtime actually
          # load? One subprocess each, because the failure is a segfault and a
          # single process would only ever report the first one to die.
          #
          # Diagnostic, and deliberately not fatal: the selftest below is what
          # decides the job.
          echo "=== model variant probe ==="
          REV=1939ad2a8e416c0acfeecc08a694d14ef25f2231
          for m in model_quantized model_fp16 model_uint8f16 model; do
            f="$RUNNER_TEMP/$m.onnx"
            echo "--- $m ---"
            curl --fail --location --silent --retry 2 --output "$f" \
              "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/$REV/onnx/$m.onnx" \
              || { echo "  (download failed)"; continue; }
            "$exe" --probe-model "$f" || echo "  -> $m did NOT survive (exit $?)"
            rm -f "$f"
          done
          echo "=== end probe ==="

          "$exe" --selftest

      # ─────────────────────────────────────────────────────────────────────
      # The gate, proven from the artifact instead of from this file.
      #
      # `VITE_AUTH_GATE: "on"` above is a claim. Every way it can quietly stop
      # being true fails *open*: bare `on` read as YAML 1.1 arrives as "true",
      # a typo arrives as itself, a stray `.env` shadows the environment — and
      # `AUTH_GATE_ENABLED` accepts none of them, so the build goes green, the
      # installers verify, the release drafts, and the app opens for whoever
      # runs it. Nothing else in this workflow looks at the frontend bundle.
      #
      # Differential rather than a pinned hash, which would go stale on the
      # next commit that touches the frontend. Vite names each chunk after a
      # hash of its contents and Tauri embeds the frontend keyed by that name,
      # so building this same tree twice more — once gated, once not — turns
      # the question into two comparisons:
      #
      #   gated ≠ ungated    the flag still changes the output at all
      #   shipped = gated    the binary carries the gated build
      #
      # The first is what keeps the second honest: take the gate out and a
      # check that only asked "is this not the ungated bundle?" passes forever.
      #
      # Enforced on tags, reported on dispatch. Building without the gate for a
      # tester who cannot sign in is a documented thing to do; releasing that
      # way is not.
      - name: Verify the gate — the shipped bundle is the gated build
        shell: bash
        run: |
          set -euo pipefail

          # What gets checked: the release binary, before bundling.
          #
          # Not the copy inside the .app, because by the time this step runs
          # there is no .app. Tauri's dmg bundler removes it once the dmg is
          # packed — the build log says so outright:
          #
          #   Cleaning .../bundle/macos/Raw Footage, Real Story.app
          #
          # Windows has no such copy either: `bundle/` there holds the NSIS and
          # MSI installers, never a file by this name. The first version of
          # this check looked under `bundle/` first and fell through to here on
          # both platforms, every time, without ever saying so.
          #
          # Equivalent regardless, which is why that branch was never missed.
          # This is the exact file Tauri copies into the .app and then
          # codesigns, and signing rewrites the signature, not the embedded
          # assets. Confirmed by hand against the published v0.2.0 dmg: the
          # .app binary inside it carries the same bundle name this check reads
          # off the pre-bundle binary here.
          #
          # `release` pinned rather than assumed: rust-cache can restore a
          # target/debug binary from an earlier run, and find would happily
          # hand back that one instead.
          bin=$(find src-tauri/target -type f -path "*/release/*" \
                  \( -name raw-footage-real-story -o -name raw-footage-real-story.exe \) \
                  -not -path "*/deps/*" -not -path "*/build/*" -not -path "*/incremental/*" | head -1)
          [ -n "$bin" ] || { echo "::error::No application binary under src-tauri/target."; exit 1; }
          echo "binary: $bin"

          # The two controls. Same tree, same node_modules, one variable
          # between them. Written beside dist/ rather than over it, because
          # dist/ is what tauri-action has already embedded.
          VITE_AUTH_GATE=on npx vite build --outDir .gate-check/on  --emptyOutDir >/dev/null
          VITE_AUTH_GATE= npx vite build --outDir .gate-check/off --emptyOutDir >/dev/null

          n=$(find .gate-check/on/assets -name 'index-*.js' | wc -l | tr -d ' ')
          if [ "$n" != 1 ]; then
            echo "::error::Expected one entry chunk, found $n — the frontend code-splits now, and this check has to compare a manifest rather than a single name."
            exit 1
          fi

          gated=$(basename "$(find .gate-check/on/assets  -name 'index-*.js' | head -1)")
          plain=$(basename "$(find .gate-check/off/assets -name 'index-*.js' | head -1)")
          echo "gated build:   $gated"
          echo "ungated build: $plain"

          # A printable-runs dump of the binary, taken once.
          #
          # Cut into runs rather than matched in place, because BSD grep, GNU
          # grep and whatever is on a contributor's PATH disagree about -a on
          # a 40 MB file with almost no newlines in it. This is all `strings`
          # does, via the one tool both runners are certain to have.
          #
          # Written to a file rather than piped, which is how the first draft
          # of this check was wrong: `grep -q` closes the pipe on its first
          # hit, tr dies of SIGPIPE, and `set -o pipefail` turns a successful
          # match into a failed one — reporting a correctly gated build as
          # unverifiable, which is a red release for no reason.
          mkdir -p .gate-check
          LC_ALL=C tr -c '[:print:]' '\n' < "$bin" > .gate-check/strings.txt
          embeds() { grep -qF "$1" .gate-check/strings.txt; }

          problem=""
          if [ "$gated" = "$plain" ]; then
            problem="VITE_AUTH_GATE no longer changes the bundle at all. Either AUTH_GATE_ENABLED stopped reading it or the gate is gone — until that is fixed this check proves nothing."
          elif embeds "/assets/$plain"; then
            problem="This build embeds the UNGATED bundle ($plain). VITE_AUTH_GATE did not reach vite as the exact string \"on\", and the app it produces opens without asking anybody to sign in."
          elif ! embeds "/assets/$gated"; then
            problem="The binary embeds neither control bundle, so what it does carry is unknown. Either the build does not reproduce here or Tauri's asset embedding changed shape — either way this check needs rewriting before it can be believed."
          else
            echo "OK — the shipped bundle is the gated build ($gated)."
          fi

          rm -rf .gate-check

          if [ -n "$problem" ]; then
            case "${GITHUB_REF:-}" in
              refs/tags/*) echo "::error::$problem"; exit 1 ;;
              *) echo "::warning::$problem (dispatch build, so reported rather than enforced)" ;;
            esac
          fi

      # Convenience only, and it must never decide whether a build passed.
      # tauri-action has already attached the installers to the release by this
      # point; this exists so a dispatch check can be downloaded. It has been
      # failing on GitHub's artifact storage quota — which recalculates every
      # 6-12 hours, so it stays red for hours after the space is freed — and a
      # correct build reported as failed cost real time during the v0.4.0
      # investigation.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: installers-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
